name: CI

on:
  push:
    branches:
      - master
      - "p0/**"
      - "p1/**"
      - "p2/**"
      - "p3/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build-and-test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore DistrictJsonToSql/DistrictJsonToSql.csproj
          dotnet restore tests/DistrictJsonToSql.Tests/DistrictJsonToSql.Tests.csproj
          dotnet restore DistrictJsonToSql.Cli/DistrictJsonToSql.Cli.csproj

      - name: Build app (net10 WinExe)
        run: dotnet build DistrictJsonToSql/DistrictJsonToSql.csproj -c Release --no-restore

      # 自包含单文件，用户双击即可运行，无需额外安装 .NET 桌面运行时
      - name: Publish self-contained exe
        run: |
          dotnet publish DistrictJsonToSql/DistrictJsonToSql.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist
          Get-ChildItem dist | Select-Object Name, Length

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: DistrictJsonToSql-win-x64
          path: dist/DistrictJsonToSql.exe
          if-no-files-found: error

      - name: Test
        run: dotnet test tests/DistrictJsonToSql.Tests/DistrictJsonToSql.Tests.csproj --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Build CLI
        run: dotnet build DistrictJsonToSql.Cli/DistrictJsonToSql.Cli.csproj -c Release --no-restore

      # 真跑 CLI：生成的 SQL 与 golden 比对，并验证 0/2/3/4/5 退出码
      - name: CLI smoke
        shell: pwsh
        run: ./tests/cli-smoke.ps1

      # 防止 workflow 变成“空跑”：必须确认 TRX 里真的有用例被执行且至少一个通过。
      - name: Prove tests actually executed
        shell: pwsh
        run: |
          $trxFile = Get-ChildItem -Path TestResults -Recurse -Filter *.trx | Select-Object -First 1
          if (-not $trxFile) {
            throw "没有生成 TRX 结果文件，测试没有真正执行"
          }

          [xml]$trx = Get-Content $trxFile.FullName
          $results = @($trx.TestRun.Results.UnitTestResult)
          $total = $results.Count
          $passed = @($results | Where-Object { $_.outcome -eq "Passed" }).Count

          Write-Host "total=$total passed=$passed"
          if ($total -lt 1) { throw "测试总数为 0，workflow 属于空跑" }
          if ($passed -lt 1) { throw "没有任何用例通过，workflow 属于空跑" }
